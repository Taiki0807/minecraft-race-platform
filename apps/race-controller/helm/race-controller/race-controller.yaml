apiVersion: v1
kind: ServiceAccount
metadata:
  name: race-controller
  namespace: minecraft-race
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: race-controller
  namespace: minecraft-race
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - persistentvolumeclaims
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: race-controller
  namespace: minecraft-race
subjects:
  - kind: ServiceAccount
    name: race-controller
    namespace: minecraft-race
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: race-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: race-controller
  namespace: minecraft-race
spec:
  replicas: 1
  selector:
    matchLabels:
      app: race-controller
  template:
    metadata:
      labels:
        app: race-controller
    spec:
      serviceAccountName: race-controller
      nodeSelector:
        kubernetes.io/hostname: k8s-master
      containers:
        - name: race-controller
          image: minecraft-race-controller:finish-v2
          imagePullPolicy: Never
          env:
            - name: RACE_EVENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: race-event-api-token
                  key: token
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 50Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: race-controller
  namespace: minecraft-race
spec:
  type: ClusterIP
  selector:
    app: race-controller
  ports:
    - name: http
      port: 8080
      targetPort: http